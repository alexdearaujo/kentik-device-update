[project]
name = "kentik-snmp-migrate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "rich>=13",
]

[project.scripts]
kentik-snmp-migrate = "kentik_snmp_migrate.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kentik_snmp_migrate"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
